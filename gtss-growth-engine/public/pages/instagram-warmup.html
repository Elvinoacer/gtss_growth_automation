<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Warmup - Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Instagram Warmup page — body markup is split into thematic partials
      under public/pages/instagram-warmup/. Each <div data-include="...">
      placeholder is resolved server-side by src/utils/renderPage.js
      (resolveIncludes) at request time. Page-specific styles live in
      /pages/instagram-warmup/warmup-page.css (linked below) instead of an
      inline <style> block. Page-specific JS lives in
      /pages/instagram-warmup/warmup-page.js (loaded after /js/app.js).
    -->
    <link rel="stylesheet" href="/pages/instagram-warmup/warmup-page.css" />
    <meta
      name="description"
      content="Manage progressive warmup outreach flows for Instagram prospects."
    />
  </head>
  <body data-page-title="Instagram Warmup">
    <!-- SHELL -->
    <main class="page-content">
      <div class="warmup-page">
        <div data-include="instagram-warmup/stat-cards.html"></div>
        <div data-include="instagram-warmup/controls-bar.html"></div>
        <div data-include="instagram-warmup/settings-accordion.html"></div>
        <div data-include="instagram-warmup/kanban-board.html"></div>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/pages/instagram-warmup/warmup-page.js"></script>
  </body>
</html>
