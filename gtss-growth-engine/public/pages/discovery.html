<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Discovery - Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Lead Discovery page — body markup is split into thematic partials

      inline <style> block.
    -->
    <link rel="stylesheet" href="/pages/discovery/discovery-page.css" />
  </head>
  <body data-page-title="Lead Discovery">
    <!-- SHELL -->
    <main class="page-content">
      <div class="discovery-page">
        <div data-include="discovery/discovery-form.html"></div>
        <div data-include="discovery/discovered-leads.html"></div>
        <div data-include="discovery/history.html"></div>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/discovery.js"></script>
  </body>
</html>
