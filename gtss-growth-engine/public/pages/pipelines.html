<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipeline Scheduler - GTSS Growth Engine</title>
    <meta
      name="description"
      content="Configure and monitor automated pipelines — Lead Outreach and Auto-Content Posting with cron scheduling, limits, and real-time status."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0ea5e9",
              "primary-strong": "#0369a1",
              "primary-soft": "#cffafe",
              surface: "#07111f",
              "surface-strong": "#0b1727",
              "surface-muted": "#132238",
              "surface-card": "rgba(8, 15, 30, 0.72)",
              "surface-card-strong": "rgba(10, 20, 38, 0.9)",
              "on-surface": "#edf2ff",
              "on-surface-muted": "#9fb0cf",
              outline: "rgba(155, 176, 214, 0.22)",
              success: "#22c55e",
              warning: "#f59e0b",
              danger: "#f87171",
            },
            fontFamily: {
              body: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            boxShadow: {
              glass: "0 24px 80px rgba(0, 0, 0, 0.35)",
              glow: "0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 80px rgba(0, 0, 0, 0.35)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(
            circle at top left,
            rgba(14, 165, 233, 0.22),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(96, 165, 250, 0.18),
            transparent 26%
          ),
          linear-gradient(180deg, #050b15 0%, #081120 45%, #09101b 100%);
        color: #edf2ff;
        font-family: Inter, system-ui, sans-serif;
      }

      .glass-panel {
        background: linear-gradient(
          180deg,
          rgba(8, 15, 30, 0.9),
          rgba(15, 23, 42, 0.82)
        );
        border: 1px solid rgba(148, 163, 184, 0.26);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
      }

      .glass-panel-soft {
        background: rgba(11, 18, 34, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.18);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .focus-ring:focus-visible,
      .page-content a:focus-visible,
      .page-content button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 3px;
      }

      .page-content {
        background:
          radial-gradient(
            circle at top left,
            rgba(14, 165, 233, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at top right,
            rgba(96, 165, 250, 0.1),
            transparent 24%
          ),
          linear-gradient(180deg, #050b15 0%, #08111f 100%) !important;
        color: #e2e8f0 !important;
      }

      .page-content > main {
        background: transparent !important;
      }

      .page-content .glass-panel {
        color: #e2e8f0;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        background: linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.96),
          rgba(15, 23, 42, 0.84)
        );
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      .page-content .glass-panel-soft {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: #e2e8f0;
      }

      .page-content .gtss-sidebar {
        background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
        border-right-color: rgba(148, 163, 184, 0.16);
      }

      .page-content .gtss-nav__link:hover,
      .page-content .gtss-nav__link.active {
        background: rgba(14, 165, 233, 0.16);
        color: #ffffff;
        border-left-color: #38bdf8;
      }

      @keyframes float-in {
        0% {
          opacity: 0;
          transform: translateY(14px) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .animate-card {
        animation: float-in 520ms ease-out both;
      }

      .animate-card:nth-child(2) {
        animation-delay: 120ms;
      }

      .hero-grid {
        position: relative;
        overflow: hidden;
      }

      .hero-grid::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.4),
          transparent 90%
        );
        pointer-events: none;
      }

      .hero-orb {
        position: absolute;
        inset: auto auto 0 0;
        width: clamp(220px, 30vw, 420px);
        height: clamp(220px, 30vw, 420px);
        border-radius: 999px;
        background: radial-gradient(
          circle,
          rgba(14, 165, 233, 0.28),
          rgba(14, 165, 233, 0) 68%
        );
        filter: blur(8px);
        pointer-events: none;
      }

      /* Cron preset buttons */
      .cron-preset-btn {
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.5);
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 150ms;
      }

      .cron-preset-btn:hover {
        background: rgba(14, 165, 233, 0.12);
        border-color: rgba(14, 165, 233, 0.3);
        color: #e2e8f0;
      }

      .cron-preset-btn.active {
        background: rgba(14, 165, 233, 0.2);
        border-color: rgba(14, 165, 233, 0.5);
        color: #38bdf8;
        box-shadow: 0 0 12px rgba(14, 165, 233, 0.15);
      }

      /* Pipeline card transitions */
      .pipeline-card {
        transition: box-shadow 300ms ease, transform 200ms ease;
      }

      .pipeline-card:hover {
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(148, 163, 184, 0.12);
        transform: translateY(-2px);
      }

      .pipeline-action-btn:hover {
        filter: brightness(1.2);
      }

      /* Toggle styling */
      .pipeline-toggle:hover .pipeline-toggle-slider {
        filter: brightness(1.15);
      }
    </style>
  </head>
  <body data-page-title="Pipeline Scheduler">
    <!-- SHELL -->
    <main class="page-content">
      <div
        class="relative mx-auto flex w-full max-w-[1600px] flex-col gap-6 px-4 py-4 sm:px-6 lg:px-8 lg:py-6"
      >
        <!-- Hero Section -->
        <section
          class="hero-grid glass-panel relative rounded-[28px] p-6 sm:p-8 lg:p-10"
        >
          <div class="hero-orb"></div>
          <div class="relative z-10 space-y-5">
            <div
              class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-sky-100/90"
            >
              <span
                class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_0_6px_rgba(34,197,94,0.14)]"
              ></span>
              Automation Control
            </div>
            <div class="max-w-3xl space-y-3">
              <p
                class="text-sm font-semibold uppercase tracking-[0.2em] text-sky-200/70"
              >
                Pipeline Scheduler
              </p>
              <h1
                class="text-3xl font-extrabold leading-tight text-white sm:text-4xl lg:text-5xl"
              >
                Configure, schedule, and monitor your growth pipelines.
              </h1>
              <p
                class="max-w-2xl text-base leading-7 text-slate-300 sm:text-lg"
              >
                Toggle pipelines on or off, adjust cron schedules, set per-run
                limits, and view run history — all in real-time without
                restarting the server.
              </p>
            </div>
          </div>
        </section>

        <!-- Pipeline Cards Container -->
        <div id="pipelines-container" class="flex flex-col gap-6">
          <!-- Cards rendered by JS -->
          <div class="glass-panel-soft rounded-[24px] p-12" style="display:grid;place-items:center">
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#64748b">
              <span style="font-size:28px;animation:spin 1.5s linear infinite">⟳</span>
              <span style="font-size:14px">Loading pipelines...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pipelines.js"></script>
  </body>
</html>
