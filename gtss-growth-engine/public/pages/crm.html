<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Pipeline - Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#004ac6",
              "on-primary": "#ffffff",
              "primary-container": "#dbe1ff",
              "on-primary-container": "#00174b",
              secondary: "#515f74",
              "on-secondary": "#ffffff",
              surface: "#060b14",
              "on-surface": "#191c1e",
              "surface-variant": "#e0e3e5",
              "on-surface-variant": "#434655",
              outline: "#737686",
              "outline-variant": "#c3c6d7",
              error: "#ba1a1a",
              "on-error": "#ffffff",
              success: "#16a34a",
              warning: "#f59e0b",
            },
            fontFamily: {
              "body-sm": ["Geist"],
              "headline-md": ["Geist"],
              "display-lg": ["Geist"],
              "label-caps": ["Geist"],
            },
          },
        },
      };
    </script>
    <!--
      CRM page — body markup is split into thematic partials under
      public/pages/crm/. Each <div data-include="..."> placeholder is
      resolved server-side by src/utils/renderPage.js (resolveIncludes)
      at request time, so the rendered HTML is byte-equivalent to the
      original monolithic crm.html. The small amount of page-specific
      CSS (kanban drag state + drawer animation) stays inline below
      since it is well under 500 lines.
    -->
    <style>
      /* Kanban specific styles */
      .kanban-column {
        min-height: 500px;
      }
      .kanban-card {
        cursor: grab;
      }
      .kanban-card:active {
        cursor: grabbing;
      }
      .kanban-card.dragging {
        opacity: 0.5;
        transform: scale(0.98);
      }
      .kanban-column.drag-over {
        background-color: theme("colors.surface-variant" / 30%);
        border-color: theme("colors.primary");
      }
      /* Drawer animation */
      #lead-drawer {
        transition: transform 0.3s ease-in-out;
      }
      #lead-drawer.open {
        transform: translateX(0);
      }
      #lead-drawer.closed {
        transform: translateX(100%);
      }
      .backdrop {
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        opacity: 0;
      }
      .backdrop.open {
        pointer-events: auto;
        opacity: 1;
      }
    </style>
  </head>
  <body data-page-title="CRM">
    <!-- SideNavBar -->
    <div data-include="crm/sidebar.html"></div>

    <!-- Main Workspace -->
    <div
      class="flex-1 flex flex-col h-full ml-[260px] w-[calc(100%-260px)] relative bg-surface"
    >
      <!-- TopNavBar -->
      <div data-include="crm/topbar.html"></div>

      <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
        <!-- Stats Bar -->
        <div data-include="crm/stats-bar.html"></div>

        <!-- Toolbar: Search, Filters, View Toggle -->
        <div data-include="crm/toolbar.html"></div>

        <!-- KANBAN VIEW -->
        <div data-include="crm/kanban-view.html"></div>

        <!-- LIST VIEW (Hidden by default) -->
        <div data-include="crm/list-view.html"></div>
      </main>
    </div>

    <!-- Drawer backdrop + Lead Detail Drawer -->
    <div data-include="crm/lead-drawer.html"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/crm.js"></script>
  </body>
</html>
