<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - GTSS Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Dashboard page — body markup is split into thematic partials under
      public/pages/dashboard/. Each <div data-include="..."> placeholder is
      resolved server-side by src/utils/renderPage.js (resolveIncludes) at
      request time. Page-specific styles live in /pages/dashboard/dashboard-page.css
      (linked below) instead of an inline <style> block.
    -->
    <link rel="stylesheet" href="/pages/dashboard/dashboard-page.css" />
    <meta
      name="description"
      content="GTSS Growth Engine analytics dashboard — track leads, outreach funnels, automation health, and content scheduling."
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0ea5e9",
              "primary-strong": "#0369a1",
              "primary-soft": "#cffafe",
              surface: "#07111f",
              "surface-strong": "#0b1727",
              "surface-muted": "#132238",
              "surface-elevated": "#1a2c45",
              ink: "#e2e8f0",
              "ink-muted": "#94a3b8",
              "ink-subtle": "#64748b",
              success: "#22c55e",
              warning: "#f59e0b",
              danger: "#ef4444",
              accent: "#a78bfa",
            },
            fontFamily: {
              sans: ["Geist", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            boxShadow: {
              glass: "0 24px 80px rgba(0, 0, 0, 0.35)",
              glow: "0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 80px rgba(0, 0, 0, 0.35)",
            },
          },
        },
      };
    </script>
  </head>
  <body data-page-title="Dashboard">
    <!-- SHELL -->
    <main class="page-content">
      <div
        class="dashboard-shell relative mx-auto flex w-full max-w-[1600px] flex-col gap-6 px-4 py-4 sm:px-6 lg:px-8 lg:py-6"
      >
        <div data-include="dashboard/hero.html"></div>
        <div data-include="dashboard/quick-start.html"></div>
        <div data-include="dashboard/stat-cards.html"></div>
        <div data-include="dashboard/outreach-funnel.html"></div>
        <div data-include="dashboard/recent-replies.html"></div>
        <div data-include="dashboard/message-variants.html"></div>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/signin-modal.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
