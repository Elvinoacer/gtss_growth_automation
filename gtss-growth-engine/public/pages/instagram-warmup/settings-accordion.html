        <!-- ============ SETTINGS ACCORDION ============ -->
        <section id="settings-panel" class="settings-panel" aria-label="Step Delay Configuration">
          <div class="settings-title">
            <span>⚙</span> Step Delay Settings (Hours)
          </div>
          <form id="settings-form" class="settings-grid">
            <!-- Group 1: Follow -> Story -->
            <div class="settings-group">
              <div class="settings-group-title">1. Follow ➔ Story</div>
              <div class="settings-inputs">
                <div>
                  <label for="warmup_min_follow_to_story_hours">Min Hours</label>
                  <input type="number" id="warmup_min_follow_to_story_hours" name="warmup_min_follow_to_story_hours" min="1" max="240" required />
                </div>
                <div>
                  <label for="warmup_max_follow_to_story_hours">Max Hours</label>
                  <input type="number" id="warmup_max_follow_to_story_hours" name="warmup_max_follow_to_story_hours" min="1" max="240" required />
                </div>
              </div>
            </div>

            <!-- Group 2: Story -> Like -->
            <div class="settings-group">
              <div class="settings-group-title">2. Story ➔ Like</div>
              <div class="settings-inputs">
                <div>
                  <label for="warmup_min_story_to_like_hours">Min Hours</label>
                  <input type="number" id="warmup_min_story_to_like_hours" name="warmup_min_story_to_like_hours" min="1" max="240" required />
                </div>
                <div>
                  <label for="warmup_max_story_to_like_hours">Max Hours</label>
                  <input type="number" id="warmup_max_story_to_like_hours" name="warmup_max_story_to_like_hours" min="1" max="240" required />
                </div>
              </div>
            </div>

            <!-- Group 3: Like -> DM -->
            <div class="settings-group">
              <div class="settings-group-title">3. Like ➔ DM Ready</div>
              <div class="settings-inputs">
                <div>
                  <label for="warmup_min_like_to_dm_hours">Min Hours</label>
                  <input type="number" id="warmup_min_like_to_dm_hours" name="warmup_min_like_to_dm_hours" min="1" max="240" required />
                </div>
                <div>
                  <label for="warmup_max_like_to_dm_hours">Max Hours</label>
                  <input type="number" id="warmup_max_like_to_dm_hours" name="warmup_max_like_to_dm_hours" min="1" max="240" required />
                </div>
              </div>
            </div>

            <!-- Group 4: Outreach & Testing -->
            <div class="settings-group">
              <div class="settings-group-title">4. Outreach & Testing</div>
              <div class="settings-inputs">
                <div>
                  <label for="fast_warmup_enabled">Fast Mode</label>
                  <select id="fast_warmup_enabled" name="fast_warmup_enabled" style="min-height: 36px; background: #1e293b; border: 1px solid var(--gtss-card-border); border-radius: 6px; color: var(--gtss-text); padding: 6px 10px; font: inherit; font-size: 13px;">
                    <option value="0">Disabled</option>
                    <option value="1">Enabled</option>
                  </select>
                </div>
                <div>
                  <label for="auto_warmup_on_qualify">Auto Warmup</label>
                  <select id="auto_warmup_on_qualify" name="auto_warmup_on_qualify" style="min-height: 36px; background: #1e293b; border: 1px solid var(--gtss-card-border); border-radius: 6px; color: var(--gtss-text); padding: 6px 10px; font: inherit; font-size: 13px;">
                    <option value="1">Enabled</option>
                    <option value="0">Disabled</option>
                  </select>
                </div>
              </div>
            </div>
          </form>
          <div style="display: flex; justify-content: flex-end; width: 100%">
            <button id="btn-save-settings" class="success-button" type="button" style="min-height: 38px">
              Save Delay Configurations
            </button>
          </div>
        </section>
