        <!-- ============ KANBAN BOARD ============ -->
        <section class="kanban-board" id="kanban-board" aria-label="Kanban Warmup Pipeline">
          <!-- Column 1: Following -->
          <div class="kanban-column" data-status="following" id="col-following">
            <div class="kanban-header">
              <span class="kanban-title">
                <span class="column-icon">👤</span> Following
              </span>
              <span class="column-count" id="count-following">0</span>
            </div>
            <div class="kanban-cards" id="cards-following"></div>
          </div>

          <!-- Column 2: Story Viewed -->
          <div class="kanban-column" data-status="story_viewed" id="col-story_viewed">
            <div class="kanban-header">
              <span class="kanban-title">
                <span class="column-icon">👁</span> Story Viewed
              </span>
              <span class="column-count" id="count-story_viewed">0</span>
            </div>
            <div class="kanban-cards" id="cards-story_viewed"></div>
          </div>

          <!-- Column 3: Liked -->
          <div class="kanban-column" data-status="liked" id="col-liked">
            <div class="kanban-header">
              <span class="kanban-title">
                <span class="column-icon">❤️</span> Liked
              </span>
              <span class="column-count" id="count-liked">0</span>
            </div>
            <div class="kanban-cards" id="cards-liked"></div>
          </div>

          <!-- Column 4: DM Ready -->
          <div class="kanban-column" data-status="warmup_complete" id="col-warmup_complete">
            <div class="kanban-header">
              <span class="kanban-title">
                <span class="column-icon">✉️</span> DM Ready
              </span>
              <span class="column-count" id="count-warmup_complete">0</span>
            </div>
            <div class="kanban-cards" id="cards-warmup_complete"></div>
          </div>
        </section>
