<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message Generator - Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <meta
      name="description"
      content="Generate, review, and approve AI-crafted outreach messages for qualified leads."
    />
    <!--
      Message Generator page — body markup is split into thematic partials
      under public/pages/message-generator/. Each <div data-include="...">
      placeholder is resolved server-side by src/utils/renderPage.js
      (resolveIncludes) at request time. Page-specific styles live in
      /pages/message-generator/msg-page.css (linked below) instead of an
      inline <style> block.
    -->
    <link rel="stylesheet" href="/pages/message-generator/msg-page.css" />
  </head>
  <body data-page-title="Message Generator">
    <!-- SHELL -->
    <main class="page-content">
      <div class="msg-page">
        <div data-include="message-generator/stat-cards.html"></div>
        <div data-include="message-generator/actions.html"></div>
        <div data-include="message-generator/progress.html"></div>
        <div data-include="message-generator/table-section.html"></div>
      </div>
    </main>

    <div data-include="message-generator/review-modal.html"></div>
    <div data-include="message-generator/settings-toggle.html"></div>
    <div data-include="message-generator/settings-panel.html"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/messages.js"></script>
  </body>
</html>
