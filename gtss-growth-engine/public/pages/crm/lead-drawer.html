<!-- crm/lead-drawer.html — CRM page lead detail drawer + backdrop
     Extracted from crm.html. Two siblings: the #drawer-backdrop (a
     fixed translucent overlay) and the #lead-drawer 420px right-docked
     sheet. The drawer shows lead header info (name / role / platform /
     profile link), a Next Action dropdown with conditional meeting
     fields, an auto-saving Notes textarea, and a JS-populated
     Touchpoint Timeline. Rendered server-side via data-include. -->

    <!-- Backdrop for Drawer -->
    <div
      id="drawer-backdrop"
      class="fixed inset-0 bg-black/20 z-30 backdrop closed"
    ></div>

    <!-- Lead Detail Drawer -->
    <div
      id="lead-drawer"
      class="fixed right-0 top-0 h-full w-[420px] bg-white shadow-2xl z-40 closed flex flex-col border-l border-outline-variant"
    >
      <div
        class="px-6 py-4 border-b border-outline-variant flex justify-between items-center bg-gray-50"
      >
        <h2 class="text-lg font-bold text-on-surface">Lead Details</h2>
        <button
          id="close-drawer-btn"
          class="text-gray-400 hover:text-gray-600 transition-colors"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Header Info -->
        <div>
          <div class="flex justify-between items-start">
            <div>
              <h3 id="drawer-name" class="text-xl font-bold text-on-surface">
                Name
              </h3>
              <p id="drawer-role-company" class="text-sm text-gray-600 mt-1">
                Role at Company
              </p>
            </div>
            <span
              id="drawer-platform"
              class="px-2 py-1 bg-gray-100 rounded text-xs font-semibold text-gray-600 capitalize"
              >Platform</span
            >
          </div>
          <div class="flex gap-2 mt-3">
            <a
              id="drawer-profile-url"
              href="#"
              target="_blank"
              class="text-xs text-primary hover:underline flex items-center gap-1"
            >
              <span class="material-symbols-outlined text-[14px]">link</span>
              Profile
            </a>
          </div>
        </div>

        <!-- Action Dropdown -->
        <div
          class="bg-gray-50 p-4 rounded border border-outline-variant space-y-3"
        >
          <h4 class="text-sm font-semibold text-on-surface">Next Action</h4>
          <select
            id="drawer-action-select"
            class="w-full border border-outline-variant rounded text-sm py-2 px-3 focus:border-primary outline-none"
          >
            <option value="">Select an action...</option>
            <option value="meeting_booked">Book Meeting</option>
            <option value="converted">Mark as Converted</option>
            <option value="lost">Mark as Lost</option>
          </select>

          <div id="action-meeting-fields" class="hidden space-y-2">
            <input
              type="date"
              id="meeting-date"
              class="w-full border border-outline-variant rounded text-sm py-2 px-3 outline-none focus:border-primary"
            />
            <input
              type="text"
              id="meeting-notes"
              placeholder="Meeting link or notes..."
              class="w-full border border-outline-variant rounded text-sm py-2 px-3 outline-none focus:border-primary"
            />
          </div>

          <button
            id="save-action-btn"
            class="w-full bg-primary text-white text-sm font-semibold py-2 rounded hover:bg-primary/90 transition-colors hidden"
          >
            Save Action
          </button>
        </div>

        <!-- Notes -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <h4 class="text-sm font-semibold text-on-surface">Notes</h4>
            <span
              id="notes-saved-indicator"
              class="text-xs text-green-600 hidden flex items-center gap-1"
              ><span class="material-symbols-outlined text-[14px]">check</span>
              Saved</span
            >
          </div>
          <textarea
            id="drawer-notes"
            rows="3"
            class="w-full border border-outline-variant rounded text-sm p-3 outline-none focus:border-primary"
            placeholder="Add notes here (auto-saves)..."
          ></textarea>
        </div>

        <!-- Timeline -->
        <div>
          <h4 class="text-sm font-semibold text-on-surface mb-4">
            Touchpoint Timeline
          </h4>
          <div
            id="drawer-timeline"
            class="relative pl-3 border-l-2 border-gray-200 space-y-6"
          >
            <!-- Populated by JS -->
          </div>
        </div>
      </div>
    </div>
