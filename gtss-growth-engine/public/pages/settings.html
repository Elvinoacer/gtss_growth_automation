<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Settings page — body markup is split into thematic partials under
      public/pages/settings/. Each <div data-include="..."> placeholder is
      resolved server-side by src/utils/renderPage.js (resolveIncludes) at
      request time, so the rendered HTML is byte-equivalent to the original
      monolithic settings.html. Page-specific styles live in
      /pages/settings/settings-page.css (linked below) instead of an inline
      <style> block so the head stays small and the CSS is browser-cached.
    -->
    <link rel="stylesheet" href="/pages/settings/settings-page.css" />
  </head>
  <body data-page-title="Settings">
    <!-- SHELL injected here by app.js -->
    <a class="settings-skip-link" href="#main-content">Skip to settings content</a>
    <main class="page-content" id="main-content">
      <div class="settings-page">
        <div data-include="settings/hero.html"></div>
        <div data-include="settings/nav.html"></div>
        <div data-include="settings/context.html"></div>
        <div data-include="settings/context-preview-modal.html"></div>
        <div data-include="settings/platform-sessions.html"></div>
        <div data-include="settings/api-config.html"></div>
        <div data-include="settings/automation-browser.html"></div>
        <div data-include="settings/daily-limits.html"></div>
        <div data-include="settings/pipeline-config.html"></div>
        <div data-include="settings/instagram.html"></div>
        <div data-include="settings/pipeline-reliability.html"></div>
        <div data-include="settings/prompt-templates.html"></div>
        <div data-include="settings/message-source.html"></div>
        <div data-include="settings/scheduler-status.html"></div>
        <div data-include="settings/notifications.html"></div>
        <div data-include="settings/system.html"></div>
      </div>
    </main>

    <div id="confirm-backdrop" class="confirm-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-modal">
        <h3 id="confirm-title">Confirm</h3>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="secondary-button" type="button">Cancel</button>
          <button id="confirm-ok" class="danger-button" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/settings.js"></script>
  </body>
</html>
