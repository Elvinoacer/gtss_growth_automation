<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings - Growth Engine</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
      .settings-page { display: grid; gap: 24px; padding: 28px; }
      .settings-section { padding: 22px; }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .section-head h2, .settings-card h3 { margin: 0; color: var(--gtss-text); }
      .muted { color: var(--gtss-muted); }
      .settings-grid { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 14px; }
      .settings-card { padding: 16px; border: 1px solid var(--gtss-card-border); border-radius: var(--gtss-radius); background: #0b1220; }
      .session-card { display: grid; gap: 12px; }
      .status-badge { width: max-content; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 900; background: #334155; color: var(--gtss-muted); }
      .status-active { background: rgb(34 197 94 / 16%); color: var(--gtss-success); }
      .status-expired { background: rgb(239 68 68 / 16%); color: var(--gtss-danger); }
      .form-grid { display: grid; gap: 14px; }
      .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
      .field { display: grid; gap: 8px; color: var(--gtss-muted); font-size: 13px; font-weight: 800; flex: 1; min-width: 220px; }
      .field input, .field textarea, .field select, .limits-table input {
        min-height: 42px; border: 1px solid var(--gtss-card-border); border-radius: var(--gtss-radius);
        padding: 9px 11px; background: #0f172a; color: var(--gtss-text); font: inherit;
      }
      .field textarea { min-height: 200px; resize: vertical; }
      .primary-button, .secondary-button, .danger-button {
        min-height: 40px; border: 0; border-radius: var(--gtss-radius); padding: 0 14px;
        color: #fff; font: inherit; font-weight: 900; cursor: pointer;
      }
      .primary-button { background: var(--gtss-primary); }
      .secondary-button { background: #334155; }
      .danger-button { background: var(--gtss-danger); }
      .inline-result { min-height: 20px; color: var(--gtss-muted); font-weight: 800; }
      .inline-result.success { color: var(--gtss-success); }
      .inline-result.error { color: var(--gtss-danger); }
      .limits-table-wrap { overflow: auto; }
      .limits-table { width: 100%; border-collapse: collapse; min-width: 720px; }
      .limits-table th, .limits-table td { padding: 12px; border-bottom: 1px solid var(--gtss-card-border); color: var(--gtss-text); text-align: left; }
      .limits-table th { color: var(--gtss-muted); font-size: 12px; text-transform: uppercase; }
      .limits-table input { width: 110px; }
      .checkbox-list { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
      .checkbox-list label { display: flex; gap: 8px; align-items: center; color: var(--gtss-text); }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .tab-button { border: 1px solid var(--gtss-card-border); border-radius: var(--gtss-radius); padding: 9px 12px; background: #0f172a; color: var(--gtss-muted); cursor: pointer; }
      .tab-button.active { border-color: var(--gtss-primary); color: var(--gtss-text); background: rgb(59 130 246 / 18%); }
      .variable-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .variable-badge { border: 1px solid var(--gtss-card-border); border-radius: 999px; padding: 6px 9px; background: #0f172a; color: var(--gtss-text); cursor: pointer; }
      .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .warning-box { border: 1px solid rgb(239 68 68 / 35%); border-radius: var(--gtss-radius); padding: 12px; color: #fecaca; background: rgb(239 68 68 / 10%); }
      .confirm-backdrop { position: fixed; inset: 0; z-index: 3000; display: none; place-items: center; padding: 20px; background: rgb(2 6 23 / 72%); }
      .confirm-backdrop.visible { display: grid; }
      .confirm-modal { width: min(460px, 100%); padding: 20px; border: 1px solid var(--gtss-card-border); border-radius: var(--gtss-radius); background: var(--gtss-card-bg); color: var(--gtss-text); }
      .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
      @media (max-width: 1100px) { .settings-grid, .checkbox-list, .system-grid { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 760px) { .settings-page { padding: 18px; } .settings-grid, .checkbox-list, .system-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body data-page-title="Settings">
    <!-- SHELL -->
    <main class="page-content">
      <div class="settings-page">
        <section class="settings-section gtss-card">
          <div class="section-head"><h2>Platform Sessions</h2></div>
          <div id="session-grid" class="settings-grid"></div>
        </section>

        <section class="settings-section gtss-card">
          <div class="section-head"><h2>API Configuration</h2><span id="gemini-result" class="inline-result"></span></div>
          <div class="form-row">
            <label class="field">Gemini API Key
              <input id="gemini-key" type="password" placeholder="gAI...xyz">
            </label>
            <button id="toggle-gemini" class="secondary-button" type="button">Show</button>
            <button id="save-gemini" class="primary-button" type="button">Save</button>
            <button id="test-gemini" class="secondary-button" type="button">Test Connection</button>
          </div>
        </section>

        <section class="settings-section gtss-card">
          <div class="section-head">
            <h2>Daily Action Limits</h2>
            <div>
              <button id="reset-limits" class="secondary-button" type="button">Reset to Defaults</button>
              <button id="save-limits" class="primary-button" type="button">Save Limits</button>
            </div>
          </div>
          <div class="limits-table-wrap">
            <table class="limits-table">
              <thead><tr><th>Platform</th><th>Connections/Requests</th><th>DMs</th><th>Follows</th><th>Likes</th></tr></thead>
              <tbody id="limits-body"></tbody>
            </table>
          </div>
        </section>

        <section class="settings-section gtss-card">
          <div class="section-head"><h2>Notification Settings</h2><span id="email-result" class="inline-result"></span></div>
          <div class="form-grid">
            <div class="form-row">
              <label class="field">Gmail address
                <input id="gmail-user" type="email" placeholder="you@gmail.com">
              </label>
              <label class="field">Gmail app password
                <input id="gmail-password" type="password">
              </label>
              <button id="toggle-gmail" class="secondary-button" type="button">Show</button>
              <button id="save-gmail" class="primary-button" type="button">Save</button>
              <button id="test-email" class="secondary-button" type="button">Send Test Email</button>
            </div>
            <div class="checkbox-list">
              <label><input class="notification-checkbox" data-key="lead_replies" type="checkbox"> Lead replies</label>
              <label><input class="notification-checkbox" data-key="session_expired" type="checkbox"> Session expired</label>
              <label><input class="notification-checkbox" data-key="daily_limit_reached" type="checkbox"> Daily limit reached</label>
              <label><input class="notification-checkbox" data-key="automation_errors" type="checkbox"> Automation errors</label>
            </div>
          </div>
        </section>

        <section class="settings-section gtss-card">
          <div class="section-head"><h2>Prompt Templates</h2><span id="char-count" class="muted">0 chars</span></div>
          <div id="template-tabs" class="tabs"></div>
          <label class="field">Template
            <textarea id="template-editor"></textarea>
          </label>
          <div id="variable-badges" class="variable-badges"></div>
          <div class="form-row">
            <button id="save-template" class="primary-button" type="button">Save Template</button>
            <button id="reset-template" class="secondary-button" type="button">Reset to Default</button>
          </div>
        </section>

        <section class="settings-section gtss-card">
          <div class="section-head"><h2>System</h2><span id="app-version" class="muted"></span></div>
          <div class="system-grid">
            <div class="settings-card">
              <h3>Change Passphrase</h3>
              <div class="form-grid">
                <label class="field">Current passphrase <input id="current-passphrase" type="password"></label>
                <label class="field">New passphrase <input id="new-passphrase" type="password"></label>
                <label class="field">Confirm new passphrase <input id="confirm-passphrase" type="password"></label>
                <button id="change-passphrase" class="primary-button" type="button">Change Passphrase</button>
                <span id="passphrase-result" class="inline-result"></span>
              </div>
            </div>
            <div class="settings-card">
              <h3>Clear All Data</h3>
              <p class="warning-box">This will permanently delete all leads, messages, and history. Cannot be undone.</p>
              <label class="field">Type DELETE to confirm <input id="delete-confirmation" type="text"></label>
              <button id="clear-data" class="danger-button" type="button" disabled>Clear All Data</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="confirm-backdrop" class="confirm-backdrop">
      <div class="confirm-modal">
        <h3 id="confirm-title">Confirm</h3>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="secondary-button" type="button">Cancel</button>
          <button id="confirm-ok" class="danger-button" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/settings.js"></script>
  </body>
</html>
