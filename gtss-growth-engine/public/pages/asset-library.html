<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Library - GTSS Growth Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Asset Library page — body markup is split into thematic partials
      under public/pages/asset-library/. Each <div data-include="...">
      placeholder is resolved server-side by src/utils/renderPage.js
      (resolveIncludes) at request time, so the rendered HTML is
      byte-equivalent to the original monolithic asset-library.html.
      Page-specific styles live in /pages/asset-library-page.css (linked
      below) instead of an inline <style> block so the head stays small
      and the CSS is browser-cached. The CSS itself is split further into
      thematic modules under public/pages/asset-library-page/.
    -->
    <link rel="stylesheet" href="/pages/asset-library-page.css" />
  </head>
  <body data-page-title="Asset Library">
    <!-- SHELL -->
    <main class="page-content">
      <section class="asset-page">

        <!-- ─── Page header ─── -->
        <div data-include="asset-library/header.html"></div>

        <!-- ─── Upload + pipeline settings ─── -->
        <div data-include="asset-library/upload-toolbar.html"></div>

        <!-- ─── Asset Groups ─── -->
        <div data-include="asset-library/groups-section.html"></div>

        <!-- ─── All Assets ─── -->
        <div data-include="asset-library/all-assets.html"></div>

      </section>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/asset-library.js"></script>
  </body>
</html>
