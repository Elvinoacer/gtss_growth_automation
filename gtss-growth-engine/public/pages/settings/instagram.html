        <!-- ═══════════════════════════════════════════════════════════ INSTAGRAM AUTOMATION -->
        <section class="settings-section gtss-card" id="instagram-settings" aria-labelledby="ig-heading">
          <div class="section-head">
            <div class="section-head__title">
              <span class="section-head__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
              </span>
              <div class="section-head__heading">
                <h2 id="ig-heading">Instagram Automation</h2>
                <div class="section-head__sub">Warm-up cadence, follow management, and discovery filters — all in one place.</div>
              </div>
            </div>
            <div class="section-head__actions">
              <span id="instagram-settings-result" class="inline-result" role="status" aria-live="polite"></span>
              <button id="save-instagram-settings" class="primary-button" type="button">Save Instagram Settings</button>
            </div>
          </div>

          <div class="form-grid" style="gap: 22px">
            <!-- Subsection 1: Instagram Warm-up -->
            <div>
              <h3 style="margin: 0 0 12px; border-bottom: 1px dashed var(--gtss-card-border); padding-bottom: 6px; color: var(--gtss-primary, #3b82f6);">1. Instagram Warm-up Settings</h3>
              <div class="form-row">
                <label class="field">Follow ➔ Story Min Hours
                  <input id="warmup_min_follow_to_story_hours" type="number" min="1" max="240" required />
                </label>
                <label class="field">Follow ➔ Story Max Hours
                  <input id="warmup_max_follow_to_story_hours" type="number" min="1" max="240" required />
                </label>
                <label class="field">Story ➔ Like Min Hours
                  <input id="warmup_min_story_to_like_hours" type="number" min="1" max="240" required />
                </label>
                <label class="field">Story ➔ Like Max Hours
                  <input id="warmup_max_story_to_like_hours" type="number" min="1" max="240" required />
                </label>
              </div>
              <div class="form-row" style="margin-top: 10px">
                <label class="field">Like ➔ DM Min Hours
                  <input id="warmup_min_like_to_dm_hours" type="number" min="1" max="240" required />
                </label>
                <label class="field">Like ➔ DM Max Hours
                  <input id="warmup_max_like_to_dm_hours" type="number" min="1" max="240" required />
                </label>
                <label class="field">Fast Warm-up Mode
                  <select id="fast_warmup_enabled">
                    <option value="0">Disabled</option>
                    <option value="1">Enabled</option>
                  </select>
                </label>
                <label class="field">Auto Warm-up on Qualify
                  <select id="auto_warmup_on_qualify">
                    <option value="1">Enabled</option>
                    <option value="0">Disabled</option>
                  </select>
                </label>
              </div>
              <p class="muted" style="margin: 10px 0 0; font-size: 11.5px; line-height: 1.5;">
                <a href="/instagram/warmup" style="color: var(--settings-accent);">Open the IG Warmup dashboard</a> to see live warm-up progress for individual leads.
              </p>
            </div>

            <!-- Subsection 2: Instagram Follow Management -->
            <div>
              <h3 style="margin: 0 0 12px; border-bottom: 1px dashed var(--gtss-card-border); padding-bottom: 6px; color: var(--gtss-primary, #3b82f6);">2. Instagram Follow Management</h3>
              <div class="form-row">
                <label class="field">Unfollow After Days
                  <input id="unfollow_after_days" type="number" min="1" max="90" required />
                </label>
                <label class="field">Unfollow Pending After Days
                  <input id="unfollow_pending_after_days" type="number" min="1" max="90" required />
                </label>
                <label class="field">Max Following Ratio
                  <input id="max_following_ratio" type="number" step="0.1" min="0.1" max="50" required />
                </label>
              </div>
            </div>

            <!-- Subsection 3: Instagram Discovery Settings -->
            <div>
              <h3 style="margin: 0 0 12px; border-bottom: 1px dashed var(--gtss-card-border); padding-bottom: 6px; color: var(--gtss-primary, #3b82f6);">3. Instagram Discovery Settings</h3>
              <div class="form-row">
                <label class="field">Discovery Max Per Hashtag
                  <input id="discovery_max_per_hashtag" type="number" min="1" max="200" required />
                </label>
                <label class="field">Discovery Min Followers
                  <input id="discovery_min_followers" type="number" min="0" max="1000000" required />
                </label>
                <label class="field">Discovery Max Followers
                  <input id="discovery_max_followers" type="number" min="0" max="10000000" required />
                </label>
              </div>
              <div class="form-row" style="margin-top: 10px">
                <label class="field" style="flex: 2">Instagram Selector Version
                  <input id="ig_selector_version" type="text" placeholder="v1" required />
                </label>
                <label class="field" style="flex: 2">Instagram Blocked Until Timestamp
                  <input id="ig_blocked_until" type="text" placeholder="e.g. 2026-05-18T12:00:00Z (leave empty for none)" />
                </label>
              </div>
            </div>
          </div>
        </section>
