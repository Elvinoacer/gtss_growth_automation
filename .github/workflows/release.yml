name: Release

on:
  push:
    tags: ['v*']          # triggers when you push a tag like v1.0.0
  workflow_dispatch:      # also lets you run it manually

permissions:
  contents: write         # required to upload assets to the release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Rebuild native modules for Electron
        working-directory: desktop
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build + publish
        working-directory: desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- macOS notarization (optional — leave empty to skip) ----
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: desktop/dist/*.{exe,msi,deb,rpm,AppImage,dmg,yml}