# ─────────────────────────────────────────────────────────────────────────────
# GTSS Growth Engine — cross-platform release workflow
# ─────────────────────────────────────────────────────────────────────────────
# Triggers on any tag matching `v*` (e.g. v1.0.0, v1.1.0-beta) or manually
# via the Actions tab ("Run workflow").
#
# Builds native installers on each target OS in parallel and publishes them
# all to the SAME GitHub Release (defined by the git tag):
#   - ubuntu-latest  → .deb + .rpm + .AppImage + latest-linux.yml
#   - windows-2022   → NSIS .exe + .msi         + latest.yml
#   - macos-latest   → .dmg (x64 + arm64)       + latest-mac.yml
#
# NOTE on the Windows runner pin: `windows-latest` currently points at a
# runner image that has Visual Studio 18 (Preview) installed, which
# node-gyp <= 10.x does NOT recognise (it only knows up to VS 17 = 2022).
# If any native module's prebuilt binary is missing and node-gyp falls back
# to source compilation, the build dies with "could not find a version of
# Visual Studio 2017 or newer to use". Pinning to `windows-2022` keeps VS
# 17 on the runner so the fallback path works. We also use `--ignore-scripts`
# on the engine install (see below) so node-gyp is never invoked for
# better-sqlite3 in the first place — the Electron prebuilt is installed by
# the subsequent `electron-rebuild` step.
#
# electron-builder cannot cross-compile (no Windows .exe from Linux, no macOS
# .dmg from Windows), so a matrix is mandatory.
#
# Signing is OPTIONAL — leave the secrets unset and the workflow still
# produces working (unsigned) installers.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist in the repo)'
        required: false
        type: string

# Workflow-level permissions. The per-job GITHUB_TOKEN needs `contents: write`
# to upload assets to the release and `id-token: write` only if you use OIDC
# (e.g. for AWS-backed publishing — not needed for GitHub Releases).
permissions:
  contents: write

# Prevent two concurrent releases from racing to upload to the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build + publish on each OS in parallel
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux deb rpm AppImage
            artifact_glob: 'desktop/dist/*.{deb,rpm,AppImage,yml}'
          - os: windows-2022
            targets: --win nsis msi
            artifact_glob: 'desktop/dist/*.{exe,msi,blockmap,yml}'
          - os: macos-latest
            targets: --mac dmg
            artifact_glob: 'desktop/dist/*.{dmg,blockmap,yml}'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history so `npm version` + git tag checks work, and
          # so the workflow_dispatch tag input can be resolved.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            gtss-growth-engine/package-lock.json

      # ── Install desktop/ dependencies (Electron, electron-builder) ──────
      - name: Install desktop dependencies
        working-directory: desktop
        # `npm ci` is faster and deterministic. Falls back to `npm install`
        # only if package-lock.json is somehow out of sync.
        run: npm ci || npm install

      # ── Install gtss-growth-engine/ dependencies ────────────────────────
      # CRITICAL: the engine's node_modules (express, better-sqlite3, sharp,
      # playwright, etc.) MUST be installed before electron-builder runs,
      # because they get bundled into the .deb / .exe / .dmg as extraResources
      # (see desktop/electron-builder.yml). Without this step, the bundled
      # installer would contain the engine source but no dependencies — and
      # the server would crash on first launch with "Cannot find module
      # 'express'" (the bug that caused installs on real machines to fail).
      #
      # We skip Playwright's browser-binary download (~300 MB) because the
      # desktop launcher uses the user's installed Chrome via CDP, not
      # Playwright's bundled Chromium.
      #
      # ── Why --ignore-scripts ───────────────────────────────────────────
      # `better-sqlite3`'s install script runs `prebuild-install || node-gyp
      # rebuild`. On the Windows runner, `prebuild-install` finds no prebuilt
      # binary for the runner's exact Node patch version (e.g. 20.20.2),
      # falls back to `node-gyp rebuild`, and dies because `windows-latest`
      # has VS 18 (Preview) which node-gyp 10.x doesn't recognise.
      #
      # We don't actually WANT the Node-compatible native binary at all —
      # the server runs under Electron's bundled Node
      # (ELECTRON_RUN_AS_NODE=1), so the binary must be built against
      # ELECTRON's ABI. The next step (`electron-rebuild`) downloads the
      # Electron-compatible prebuilt from better-sqlite3's GitHub Releases
      # — no compilation, no Visual Studio, no node-gyp. `--ignore-scripts`
      # here just prevents the doomed Node-target build from running first.
      #
      # The same logic applies to `sharp`: its install script downloads the
      # prebuilt libvips binary, but the `@img/sharp-<platform>-<arch>` npm
      # packages (installed as optional deps by `npm ci`) already contain
      # the binary — so skipping the install script is safe.
      - name: Install engine dependencies
        working-directory: gtss-growth-engine
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      # ── Rebuild engine native modules for Electron's ABI ────────────────
      # The server runs under ELECTRON_RUN_AS_NODE=1 (Electron's bundled
      # Node), so native modules in gtss-growth-engine/node_modules/ MUST
      # be rebuilt against Electron's NODE_MODULE_VERSION — otherwise they
      # throw "NODE_MODULE_VERSION mismatch" on require().
      #
      # `electron-rebuild` calls `prebuild-install --runtime=electron
      # --target=<electron-version>`, which downloads the prebuilt binary
      # from better-sqlite3's GitHub Releases. No compilation needed on
      # any platform — this works on Linux, Windows, and macOS without
      # Visual Studio / Xcode / build-essential.
      #
      # The previous workflow ran `npx electron-rebuild -f -w better-sqlite3`
      # from desktop/ — but better-sqlite3 isn't a desktop/ dependency, so
      # the rebuild was a no-op. We now point --module-dir at the engine.
      - name: Rebuild native modules for Electron (better-sqlite3, sharp)
        working-directory: desktop
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npx electron-rebuild -f --module-dir "${{ github.workspace }}/gtss-growth-engine" --which better-sqlite3 --which sharp || npx electron-rebuild -f --module-dir "${{ github.workspace }}/gtss-growth-engine"

      # ── macOS only: enable notarization when APPLE_TEAM_ID is set ───────────
      # We don't touch electron-builder.yml directly. Instead we set the env
      # vars that electron-builder reads natively for notarization
      # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) and enable
      # signing via CSC_LINK / CSC_KEY_PASSWORD. When APPLE_TEAM_ID is empty,
      # electron-builder skips notarization automatically.
      - name: Build + publish (${{ matrix.targets }})
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "$WIN_CSC_LINK_RAW" ]; then export WIN_CSC_LINK="$WIN_CSC_LINK_RAW"; fi
          if [ -n "$WIN_CSC_KEY_PASSWORD_RAW" ]; then export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_RAW"; fi
          if [ -n "$CSC_LINK_RAW" ]; then export CSC_LINK="$CSC_LINK_RAW"; fi
          if [ -n "$CSC_KEY_PASSWORD_RAW" ]; then export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_RAW"; fi
          if [ -n "$APPLE_ID_RAW" ]; then export APPLE_ID="$APPLE_ID_RAW"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_RAW" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_RAW"; fi
          if [ -n "$APPLE_TEAM_ID_RAW" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_RAW"; fi
          npx electron-builder ${{ matrix.targets }} --publish always
        env:
          # GitHub token — auto-provided by Actions. Must have `contents: write`
          # (granted at the top of this file).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── Windows code signing (optional) ────────────────────────────────
          # Set WIN_CSC_LINK (base64 of .pfx) and WIN_CSC_KEY_PASSWORD in
          # repo Settings → Secrets and variables → Actions to sign the
          # .exe and .msi. Leave unset to ship unsigned (SmartScreen will
          # show a one-time "unrecognized app" warning).
          #
          # NOTE: `secrets.X` resolves to `""` when the secret doesn't exist.
          # Keep these as *_RAW and export only non-empty values in the shell
          # above, so electron-builder sees truly unset signing env vars.
          WIN_CSC_LINK_RAW: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_RAW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # ── macOS code signing + notarization (optional) ───────────────────
          # CSC_LINK = base64 of Developer ID Application .p12
          # CSC_KEY_PASSWORD = the .p12 export password
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID = for
          # notarization (creates a notarization ticket with Apple's servers
          # so Gatekeeper accepts the .dmg on first launch).
          # Same empty-string-vs-unset issue as WIN_CSC_LINK above.
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}

      # ── Upload the artifacts to the workflow run too (not just the release)
      # This makes debugging a failed release much easier — you can download
      # the actual installers from the Actions tab without waiting for the
      # release to be published.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Final sanity check — confirms all three OS jobs succeeded.
  # ───────────────────────────────────────────────────────────────────────────
  release-summary:
    name: Release summary
    needs: release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "## Release build result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-latest  | ${{ needs.release.result == 'success' && 'success' || needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| windows-2022   | ${{ needs.release.result == 'success' && 'success' || needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macos-latest   | ${{ needs.release.result == 'success' && 'success' || needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If all three rows show **success**, your release is now at:" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/Elvinoacer/gtss_growth_automation/releases/tag/${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open that link and click **Publish** (drafts are not visible to users)." >> $GITHUB_STEP_SUMMARY